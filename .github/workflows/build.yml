name: Build & Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit & integration tests
        run: npm test

      - name: Build web app
        run: npm run build

      - name: E2E test (Electron)
        run: npx playwright test

      - name: Package portable .exe
        run: npx electron-builder --win portable --x64 --publish never

      - name: Upload .exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: PDF-Merger-windows
          path: release/*.exe
          if-no-files-found: error

      - name: Attach .exe to GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.exe
